<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment & Billing | ShipChain</title><link rel="stylesheet" href="style.css"><style>main{max-width:1100px;margin:auto;padding:30px 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 8px 25px #0000000d}input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #d5dbe5;border-radius:10px}.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}.method{padding:13px;border:1px solid #d5dbe5;border-radius:10px;background:#fafafa;cursor:pointer}.method.active{border:2px solid #2563eb;background:#eff6ff}.status{margin-top:15px;padding:13px;border-radius:10px;background:#f3f6fa}.history{width:100%;border-collapse:collapse}.history th,.history td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.pill{padding:4px 8px;border-radius:20px;background:#dcfce7;color:#166534}.invoice{margin-top:24px}.invoice-line{display:flex;justify-content:space-between;padding:9px 0}.total{border-top:2px solid #111827;font-size:20px;font-weight:bold}@media(max-width:800px){.grid{grid-template-columns:1fr}}@media print{header,footer,.no-print{display:none!important}.card{box-shadow:none;border:0}.invoice{display:block!important}}</style></head><body><header class="topbar"><a class="brand" href="index.html">🚚 ShipChain</a><nav><a href="dashboard.html">Dashboard</a><a href="smart-ai.html">AI Assistant</a><a class="active" href="payment.html">Payment & Billing</a><a href="tracking.html">Track</a></nav></header><main><h1>💳 Payment & Billing</h1><p>Demo payment module for shipment billing.</p><div class="grid"><section class="card"><h2>Make Payment</h2><label>Shipment ID</label><input id="sid" placeholder="SHP-123456"><label>Amount (₹)</label><input id="amount" type="number" min="1" value="1250"><label>Payment Method</label><div class="methods"><button class="method active" data-m="UPI">📱 UPI</button><button class="method" data-m="Card">💳 Card</button><button class="method" data-m="Net Banking">🏦 Net Banking</button><button class="method" data-m="Cash on Delivery">💵 Cash on Delivery</button></div><div id="details"></div><button class="btn primary" onclick="pay()">Pay / Confirm Payment</button><div id="status" class="status" hidden></div></section><section class="card"><h2>Payment History</h2><div class="no-print"><button class="btn secondary" onclick="render()">↻ Refresh</button><button class="btn secondary" onclick="printInvoice()">🧾 Print Invoice</button></div><div id="history"></div></section></div><section class="card invoice" id="invoice"><h2>SHIPCHAIN PAYMENT RECEIPT</h2><p id="date"></p><div class="invoice-line"><span>Shipment ID</span><b id="isid"></b></div><div class="invoice-line"><span>Method</span><b id="imethod"></b></div><div class="invoice-line"><span>Transaction ID</span><b id="itxn"></b></div><div class="invoice-line total"><span>Total</span><b id="iamount"></b></div><p>Demo receipt — no real payment was processed.</p></section></main><footer>© 2026 ShipChain</footer><script>let method='UPI',key='shipchain_payments';document.querySelectorAll('.method').forEach(b=>b.onclick=()=>{document.querySelectorAll('.method').forEach(x=>x.classList.remove('active'));b.classList.add('active');method=b.dataset.m;details()});function details(){let d=document.getElementById('details');d.innerHTML=method==='UPI'?'<label>Demo UPI ID</label><input value="demo@upi">':method==='Card'?'<label>Demo Card</label><input value="4111 1111 1111 1111"><label>Expiry / CVV</label><input value="12/30 · 123">':method==='Net Banking'?'<label>Bank</label><select><option>Demo Bank</option><option>SBI</option><option>HDFC Bank</option><option>ICICI Bank</option></select>':'<p>Amount will be collected on delivery.</p>'}function data(){return JSON.parse(localStorage.getItem(key)||'[]')}function pay(){let sid=document.getElementById('sid').value.trim(),amount=Number(document.getElementById('amount').value);if(!sid||amount<1)return alert('Enter shipment ID and valid amount.');let p={shipmentId:sid,amount,method,status:method==='Cash on Delivery'?'Pending':'Paid',transactionId:'TXN-'+Math.random().toString(36).slice(2,10).toUpperCase(),date:new Date().toISOString()};let a=data();a.unshift(p);localStorage.setItem(key,JSON.stringify(a));let s=document.getElementById('status');s.hidden=false;s.innerHTML=(p.status==='Paid'?'✅ Payment successful':'🟡 COD recorded')+'<br>Transaction ID: <b>'+p.transactionId+'</b>';fill(p);render()}function fill(p){document.getElementById('date').textContent=new Date(p.date).toLocaleString();document.getElementById('isid').textContent=p.shipmentId;document.getElementById('imethod').textContent=p.method;document.getElementById('itxn').textContent=p.transactionId;document.getElementById('iamount').textContent='₹'+p.amount.toLocaleString('en-IN')}function render(){let a=data(),h=document.getElementById('history');if(!a.length){h.innerHTML='<p>No payments yet.</p>';return}h.innerHTML='<table class="history"><tr><th>Shipment</th><th>Amount</th><th>Method</th><th>Status</th><th>Transaction</th></tr>'+a.map(p=>'<tr><td>'+p.shipmentId+'</td><td>₹'+p.amount.toLocaleString('en-IN')+'</td><td>'+p.method+'</td><td><span class="pill">'+p.status+'</span></td><td>'+p.transactionId+'</td></tr>').join('')+'</table>'}function printInvoice(){let p=data()[0];if(!p)return alert('Make a payment first.');fill(p);window.print()}details();render();</script></body></html>
