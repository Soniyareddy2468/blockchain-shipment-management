<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Digital Delivery Signature | ShipChain</title><link rel="stylesheet" href="style.css"><style>.sig-card{max-width:720px;margin:auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 10px 30px rgba(20,30,50,.08)}#signaturePad{width:100%;height:260px;border:2px dashed #b8c2d1;border-radius:14px;background:#fff;touch-action:none}.row2{display:flex;gap:10px;flex-wrap:wrap}.sig-card input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border:1px solid #d8dee8;border-radius:10px}.status{margin-top:16px;padding:14px;border-radius:12px;background:#f4f8ff}</style></head><body><header class="topbar"><a class="brand" href="index.html">🚚 ShipChain</a><nav><a href="dashboard.html">Dashboard</a><a href="smart-ai.html">AI Assistant</a><a class="active" href="delivery-signature.html">Delivery Signature</a><a href="tracking.html">Track</a></nav></header><main class="page"><div class="page-title"><span class="eyebrow">PROOF OF DELIVERY</span><h1>Digital Delivery Signature</h1><p>Receiver can sign on a phone or computer to confirm delivery.</p></div><section class="sig-card"><label>Shipment ID</label><input id="shipmentId" placeholder="SHP-123456"><p>Draw the receiver's signature below.</p><canvas id="signaturePad"></canvas><div class="row2"><button class="btn secondary" id="clearBtn">Clear</button><button class="btn primary" id="saveBtn">✓ Confirm Digital Signature</button></div><div id="status" class="status" style="display:none"></div></section></main><footer>© 2026 ShipChain</footer><script>const c=document.getElementById('signaturePad'),ctx=c.getContext('2d');let drawing=false;function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=260*d;ctx.scale(d,d);ctx.lineWidth=2;ctx.lineCap='round'}resize();addEventListener('resize',resize);function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});c.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});['pointerup','pointerleave'].forEach(x=>c.addEventListener(x,()=>drawing=false));document.getElementById('clearBtn').onclick=()=>{ctx.clearRect(0,0,c.width,c.height)};document.getElementById('saveBtn').onclick=async()=>{const id=document.getElementById('shipmentId').value.trim(),status=document.getElementById('status');if(!id){status.style.display='block';status.textContent='Enter a shipment ID.';return}const signature=c.toDataURL('image/png');try{const token=localStorage.getItem('shipchain_token');const r=await fetch('/api/shipments/'+encodeURIComponent(id)+'/signature',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({signature})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to save signature');status.style.display='block';status.innerHTML='✅ Digital signature saved successfully.<br>Signature hash: <code>'+data.signatureHash+'</code>'}catch(e){status.style.display='block';status.textContent=e.message}}</script></body></html>
