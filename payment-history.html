<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Payment History | ShipChain</title><link rel="stylesheet" href="style.css"><style>main{max-width:1150px;margin:auto;padding:32px 18px}.card{background:#fff;border:1px solid #e7ebf0;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(20,30,50,.06)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;font-size:14px}.pill{padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700}.chain{font-size:12px;font-family:monospace;word-break:break-all}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input{padding:11px;border:1px solid #d8dee8;border-radius:10px}@media(max-width:700px){.table-wrap{overflow:auto}}</style></head><body><header class="topbar"><a class="brand" href="index.html">🚚 ShipChain</a><nav><a href="dashboard.html">Dashboard</a><a href="payment.html">Payment</a><a class="active" href="payment-history.html">Payment History</a><a href="tracking.html">Track</a></nav></header><main><h1>📋 Payment History</h1><p>Shipment-linked records from the backend database, including blockchain proof when configured.</p><section class="card"><div class="toolbar"><input id="shipment" placeholder="Filter by Shipment ID"><button class="btn secondary" onclick="load()">↻ Refresh</button></div><div class="table-wrap" id="out">Loading…</div></section></main><footer>© 2026 ShipChain · Payment records</footer><script>async function load(){const id=document.getElementById('shipment').value.trim(),url=id?'/api/payments?shipmentId='+encodeURIComponent(id):'/api/payments',out=document.getElementById('out');try{const r=await fetch(url),d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');if(!d.length){out.innerHTML='<p>No payment records found.</p>';return}out.innerHTML='<table><tr><th>Payment</th><th>Shipment</th><th>Amount</th><th>Method</th><th>Status</th><th>Transaction</th><th>Blockchain</th><th>Date</th></tr>'+d.map(p=>{const id=p.paymentId||p.id,ship=p.shipmentId||p.shipment_id,tx=p.transactionId||p.transaction_id,bt=p.blockchainTxHash||p.blockchain_tx_hash,bs=p.blockchainStatus||p.blockchain_status;return '<tr><td>'+id+'</td><td>'+ship+'</td><td>₹'+Number(p.amount).toLocaleString('en-IN')+'</td><td>'+p.method+'</td><td><span class="pill">'+p.status+'</span></td><td>'+tx+'</td><td>'+(bt?'<span class="pill">✓ On-chain</span><div class="chain">'+bt+'</div>':'Pending')+'<br>'+ (bs||'')+'</td><td>'+new Date(p.createdAt||p.created_at).toLocaleString()+'</td></tr>'}).join('')+'</table>'}catch(e){out.innerHTML='<p>❌ '+e.message+'</p>'}}load()</script></body></html>
