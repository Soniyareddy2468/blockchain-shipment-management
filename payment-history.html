<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment History | ShipChain</title><link rel="stylesheet" href="style.css"><style>main{max-width:1200px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(20,30,50,.06)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4;font-size:13px;vertical-align:top}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700}.pending{background:#fff7ed;color:#9a3412}.chain{font-family:monospace;word-break:break-all;font-size:11px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input{padding:11px;border:1px solid #d7dce5;border-radius:10px}@media(max-width:800px){.table-wrap{overflow:auto}}</style></head><body><header class="topbar"><a class="brand" href="index.html">🚚 ShipChain</a><nav><a href="dashboard.html">Dashboard</a><a href="payment.html">Payment</a><a class="active" href="payment-history.html">Payment History</a><a href="tracking.html">Track</a></nav></header><main><h1>📋 Payment History</h1><p>Persistent backend payment records with real on-chain verification when configured.</p><section class="card"><div class="toolbar"><input id="shipment" placeholder="Filter by Shipment ID"><button class="btn secondary" onclick="load()">↻ Refresh</button></div><div class="table-wrap" id="out">Loading…</div></section></main><footer>© 2026 ShipChain · Payment records</footer><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const filter=document.getElementById('shipment').value.trim(),url=filter?'/api/payments?shipmentId='+encodeURIComponent(filter):'/api/payments',out=document.getElementById('out');try{const r=await fetch(url),d=await r.json();if(!r.ok)throw Error(d.error||'Failed');if(!d.length){out.innerHTML='<p>No payment records found.</p>';return}out.innerHTML='<table><tr><th>Payment ID</th><th>Shipment</th><th>Amount</th><th>Method</th><th>Status</th><th>Transaction</th><th>Blockchain verification</th><th>Date</th></tr>'+d.map(p=>{const pid=p.paymentId||p.id,ship=p.shipmentId||p.shipment_id,tx=p.transactionId||p.transaction_id,bt=p.blockchainTxHash||p.blockchain_tx_hash,bs=p.blockchainStatus||p.blockchain_status||'Pending',block=p.blockchainBlock||p.blockchain_block,verified=String(bs).toLowerCase()==='verified';return '<tr><td><b>'+esc(pid)+'</b><br><small>'+esc(p.invoiceId||p.invoice_id||'')+'</small></td><td>'+esc(ship)+'</td><td>₹'+Number(p.amount).toLocaleString('en-IN')+'</td><td>'+esc(p.method)+'</td><td><span class="pill '+(p.status==='Pending'?'pending':'')+'">'+esc(p.status)+'</span></td><td>'+esc(tx)+'</td><td>'+(verified?'<span class="pill">✓ VERIFIED ON CHAIN</span>':'<span class="pill pending">⚠ NOT VERIFIED ON CHAIN</span>')+(bt?'<div class="chain">'+esc(bt)+'</div><div>Block: '+esc(block||'—')+'</div><a target="_blank" rel="noopener" href="https://sepolia.etherscan.io/tx/'+encodeURIComponent(bt)+'">View on Sepolia Etherscan ↗</a>':'')+'</td><td>'+new Date(p.createdAt||p.created_at).toLocaleString()+'</td></tr>'}).join('')+'</table>'}catch(e){out.innerHTML='<p>❌ '+esc(e.message)+'</p>'}}load()</script></body></html>
