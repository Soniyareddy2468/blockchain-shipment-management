services:
  - type: web
    name: shipchain
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: /var/data/shipchain.db
      - key: CORS_ORIGINS
        sync: false
      - key: JSON_BODY_LIMIT
        value: 12mb
    disk:
      name: shipchain-data
      mountPath: /var/data
      sizeGB: 1
