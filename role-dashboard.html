<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard | ShipChain</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">🚚 ShipChain</a><nav><a href="index.html">Home</a><a class="active" href="role-dashboard.html">Dashboard</a><button id="logoutBtn" class="btn secondary small" type="button">Logout</button></nav></header>
<main class="page"><div class="page-title"><span class="eyebrow">ROLE DASHBOARD</span><h1 id="welcome">Loading…</h1><p id="roleText">Checking your account.</p></div><section id="cards" class="cards"></section><div id="error" class="panel hidden"></div></main><footer>© 2026 ShipChain</footer>
<script>
const token=localStorage.getItem('shipchain_token');
const routes={admin:[['Admin Console','Review users and create approved transporter accounts.','admin.html','Open Admin'],['Shipment Dashboard','View shipment activity and tracking.','dashboard.html','Open Shipments']],transporter:[['Scan Shipment','Scan a package QR code and update its logistics status.','scan.html','Scan QR'],['Transporter Controls','Manage Picked Up, In Transit, Hub and Out for Delivery events.','transporter.html','Open Controls']],operator:[['Create Shipment','Create a shipment and generate its QR label.','create-shipment.html','Create Shipment'],['Shipment Dashboard','Review shipment records and events.','dashboard.html','Open Dashboard']],receiver:[['Track Shipment','View public shipment progress.','tracking.html','Track Shipment'],['Proof of Delivery','Confirm delivery with OTP, signature and photo.','pod.html','Open Delivery']]};
async function init(){if(!token){location.href='login.html?next=role-dashboard.html';return;}try{const r=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});const me=await r.json();if(!r.ok)throw new Error(me.error||'Session expired');const role=me.role;document.getElementById('welcome').textContent=`Welcome, ${me.email}`;document.getElementById('roleText').textContent=`Signed in as ${role}. Choose an action below.`;const list=routes[role];if(!list)throw new Error('No dashboard configured for this role.');document.getElementById('cards').innerHTML=list.map(x=>`<article class="card"><div class="icon">${role==='admin'?'🛡️':role==='transporter'?'🚚':role==='operator'?'📦':'📍'}</div><h3>${x[0]}</h3><p>${x[1]}</p><a class="btn primary" href="${x[2]}">${x[3]}</a></article>`).join('');}catch(e){localStorage.removeItem('shipchain_token');const box=document.getElementById('error');box.classList.remove('hidden');box.textContent=e.message+' Please sign in again.';setTimeout(()=>location.href='login.html?next=role-dashboard.html',1200);}}
document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('shipchain_token');location.href='login.html';};init();
</script></body></html>
