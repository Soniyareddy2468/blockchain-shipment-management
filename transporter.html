<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Transporter Controls | ShipChain</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">🚚 ShipChain</a><nav><a href="index.html">Home</a><a href="create-shipment.html">Create Shipment</a><a href="tracking.html">Track</a><a class="active" href="scan.html">Scan</a><a href="dashboard.html">Dashboard</a></nav></header><main class="page"><div class="page-title"><span class="eyebrow">TRANSPORTER OPERATIONS</span><h1>Shipment status controls</h1><p>Update shipment milestones after scanning its QR label.</p></div><div id="transporterResult"><div class="panel">Checking transporter access…</div></div></main><footer>© 2026 ShipChain</footer>
<script src="auth-guard.js"></script><script>ShipChainAuth.guard(['transporter'],'transporter.html'+location.search).then(function(me){if(!me)return;const API='/api';const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('transporterResult');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}async function load(){if(!id){root.innerHTML='<div class="panel"><h3>Missing shipment</h3><p>Scan a shipment QR code first.</p></div>';return;}try{const r=await fetch(API+'/shipments/'+encodeURIComponent(id));if(!r.ok)throw new Error('Shipment not found');render(await r.json());}catch(e){root.innerHTML='<div class="panel"><h3>Unable to load shipment</h3><p>'+esc(e.message)+'</p><a class="btn secondary" href="scan.html">Scan again</a></div>';}}function render(s){const seq=['Picked Up','In Transit','Arrived at Hub','Out for Delivery'],index=seq.indexOf(s.status),next=seq[index+1]||null;root.innerHTML='<div class="panel"><span class="eyebrow">SHIPMENT '+esc(s.id)+'</span><h2>'+esc(s.product)+'</h2><p><b>'+esc(s.source)+'</b> → <b>'+esc(s.destination)+'</b></p><p>Receiver: '+esc(s.receiver)+'</p><div class="panel" style="box-shadow:none;background:#f7f9fc"><b>Current status:</b> '+esc(s.status)+'<br><b>Blockchain:</b> '+esc(s.blockchain_status||'Pending')+(s.blockchain_hash?' · <code>'+esc(s.blockchain_hash)+'</code>':'')+'</div><h3>Update milestone</h3><div class="status-actions">'+seq.map((st,i)=>'<button class="btn '+(st===next?'primary':'secondary')+'" data-status="'+esc(st)+'" '+(i<=index?'disabled':'')+'>'+esc(st)+(i<=index?' ✓':'')+'</button>').join(' ')+'</div><div id="message" style="margin-top:16px"></div><h3>Event history</h3><div class="timeline-list">'+(s.events||[]).map(e=>'<div class="event '+(e.time?'done':'')+'"><div class="event-dot"></div><div><b>'+esc(e.status)+'</b><br><small>'+(e.time?new Date(e.time).toLocaleString():'Pending')+(e.location?' · '+esc(e.location):'')+(e.tx_hash?' · 🔗 '+esc(e.tx_hash):'')+'</small></div></div>').join('')+'</div><p><a href="tracking.html?id='+encodeURIComponent(s.id)+'">Open public tracking →</a></p></div>';root.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>update(s.id,b.dataset.status));}async function update(id,status){const msg=document.getElementById('message'),locationValue=prompt('Enter current location (optional):','')??'';msg.textContent='Recording '+status+'…';try{const r=await fetch(API+'/shipments/'+encodeURIComponent(id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ShipChainAuth.token()},body:JSON.stringify({status,location:locationValue})}),data=await r.json();if(!r.ok)throw new Error(data.error||'Update failed');msg.innerHTML='<b>✓ '+esc(status)+' recorded.</b> '+(data.blockchain_status==='Verified'?'Blockchain transaction confirmed.':'Blockchain is pending/not configured; the backend event was recorded.');render(data);}catch(e){msg.textContent=e.message;}}load();});</script></body></html>
