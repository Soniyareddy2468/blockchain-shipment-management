<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Receiver Dashboard | ShipChain</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">🚚 ShipChain</a><nav><a href="index.html">Home</a><a class="active" href="receiver-dashboard.html">My Shipments</a><a href="tracking.html">Track</a><button id="logout" class="btn secondary small">Logout</button></nav></header>
<main class="page"><div class="page-title row"><div><span class="eyebrow">RECEIVER PORTAL</span><h1>My shipments</h1><p id="identity">Loading your assigned shipments…</p></div><button id="refresh" class="btn secondary small">Refresh</button></div><div id="message" class="panel hidden"></div><section id="shipments" class="cards"><div class="panel">Loading shipments…</div></section></main><footer>© 2026 ShipChain · Receiver Portal</footer>
<script src="auth-guard.js"></script><script>
ShipChainAuth.guard(['receiver'],'receiver-dashboard.html').then(async me=>{if(!me)return;document.getElementById('identity').textContent=`Signed in as ${me.email}`;const token=localStorage.getItem('shipchain_token');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const box=document.getElementById('shipments');box.innerHTML='<div class="panel">Loading shipments…</div>';try{const r=await fetch('/api/receiver/shipments',{headers:{Authorization:'Bearer '+token}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Unable to load shipments');if(!data.length){box.innerHTML='<div class="panel empty">No shipments are currently assigned to your account.</div>';return;}box.innerHTML=data.map(s=>`<article class="card"><div class="status-line"><span class="dot"></span>${esc(s.status)}</div><h3>${esc(s.id)}</h3><p><b>${esc(s.product)}</b></p><p>${esc(s.source)} → ${esc(s.destination)}</p><p>Expected delivery: ${esc(s.delivery)}</p><p>POD: <span class="badge">${esc(s.pod_status||'Pending')}</span></p><div class="actions"><a class="btn secondary" href="tracking.html?id=${encodeURIComponent(s.id)}">Track</a>${s.status==='Out for Delivery'||s.status==='Delivered'?`<a class="btn primary" href="pod.html?id=${encodeURIComponent(s.id)}">Proof of Delivery</a>`:''}</div></article>`).join('');}catch(e){box.innerHTML='';const m=document.getElementById('message');m.classList.remove('hidden');m.textContent=e.message;}}document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=()=>{localStorage.removeItem('shipchain_token');localStorage.removeItem('shipchain_user');location.href='login.html';};load();});
</script></body></html>
